<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandas Picture Class — Part 2</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#ffffff; --ink:#1f2430; --muted:#5e6575; --line:#e3ded2;
  --accent:#e8a317; --accent-ink:#5a3d00; --accent-soft:#fff3d4;
  --blue:#2f6fde; --blue-soft:#e3ecfd; --green:#1e8f5a; --green-soft:#dcf3e7;
  --red:#d2453b; --red-soft:#fde4e1; --purple:#7a4cc2; --purple-soft:#eee6fa;
  --code-bg:#1e2230; --code-ink:#e9ecf3; --code-key:#ffcf66; --code-str:#9ee59e; --code-num:#8fc3ff; --code-com:#8a93a8;
  --shadow:0 2px 10px rgba(30,30,40,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171d; --panel:#1e2129; --ink:#eceef3; --muted:#a2a9b8; --line:#30343f;
    --accent:#f2b53a; --accent-ink:#ffe2a3; --accent-soft:#3a2f17;
    --blue:#6d9cff; --blue-soft:#1e2a45; --green:#4cc58a; --green-soft:#183427;
    --red:#ff7b70; --red-soft:#3e1f1d; --purple:#b393f0; --purple-soft:#2c2440;
    --code-bg:#0f1117; --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#15171d; --panel:#1e2129; --ink:#eceef3; --muted:#a2a9b8; --line:#30343f;
  --accent:#f2b53a; --accent-ink:#ffe2a3; --accent-soft:#3a2f17;
  --blue:#6d9cff; --blue-soft:#1e2a45; --green:#4cc58a; --green-soft:#183427;
  --red:#ff7b70; --red-soft:#3e1f1d; --purple:#b393f0; --purple-soft:#2c2440;
  --code-bg:#0f1117; --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button{font:inherit;cursor:pointer}
code,pre,.mono{font-family:Consolas,"Cascadia Code","SF Mono",Menlo,monospace}

.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin:0 6px 18px}
.brand .logo{font-size:30px}
.brand h1{font-size:18px;margin:0;line-height:1.2}
.brand small{color:var(--muted);font-size:13px}
.toc{list-style:none;margin:0;padding:0}
.toc button{width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 10px;border-radius:10px;display:flex;gap:10px;align-items:center;font-size:15px}
.toc button:hover{background:var(--accent-soft)}
.toc button.active{background:var(--accent);color:#2a1d00;font-weight:600}
.toc .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:12px;flex:none;border:1px solid var(--line)}
.toc button.active .num{background:#fff6;border-color:transparent}
.toc .sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 4px}
.toc .done .num{background:var(--green);color:#fff;border-color:transparent}
.side-foot{margin-top:18px;padding:0 8px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px}

main{padding:28px 32px 60px;max-width:1150px;width:100%}
.lesson-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
.lesson-head .big{font-size:44px;line-height:1}
.lesson-head h2{margin:0;font-size:28px}
.lesson-head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.story{background:var(--accent-soft);border:1px dashed var(--accent);color:var(--ink);border-radius:14px;padding:12px 16px;margin:10px 0 20px;max-width:80ch}
.story b{color:var(--accent-ink)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.code-card{padding:0;overflow:hidden}
.code-top{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--code-bg);border-bottom:1px solid #ffffff14}
.dot{width:11px;height:11px;border-radius:50%}
.code-top .lbl{margin-left:8px;color:var(--code-com);font-size:13px}
.code-top .copy{margin-left:auto;background:#ffffff14;color:var(--code-ink);border:0;border-radius:8px;padding:3px 10px;font-size:12px}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);padding:16px 18px;min-height:120px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.tk-k{color:var(--code-key)} .tk-s{color:var(--code-str)} .tk-n{color:var(--code-num)} .tk-c{color:var(--code-com);font-style:italic}
.caret{display:inline-block;width:8px;height:1.1em;background:var(--accent);vertical-align:text-bottom;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.teacher{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.teacher .face{font-size:34px;line-height:1}
.bubble{background:var(--blue-soft);border-radius:4px 14px 14px 14px;padding:10px 14px;flex:1;animation:pop .35s ease}
.bubble b{color:var(--blue)}

.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#2a1d00;border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.steps-dots{display:flex;gap:6px;margin-left:auto}
.steps-dots span{width:10px;height:10px;border-radius:50%;background:var(--line);transition:.3s}
.steps-dots span.on{background:var(--accent);transform:scale(1.25)}
.steps-dots span.seen{background:var(--accent);opacity:.45}

.board{min-height:340px;display:flex;flex-direction:column;gap:14px}
.board-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tables{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.arrow{font-size:28px;color:var(--accent);animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl-cap{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:600}
table.df{border-collapse:separate;border-spacing:0;font-size:14.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.df th,table.df td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;transition:background .4s,color .4s,opacity .4s}
table.df thead th{background:var(--bg);font-weight:700}
table.df tbody th{background:var(--bg);color:var(--muted);font-weight:600;text-align:center;min-width:36px}
table.df tr:last-child td,table.df tr:last-child th{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.hl{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent);animation:pulse 1.2s ease 2}
th.hl{color:var(--accent-ink)!important}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px var(--accent)}}
.hl-idx{background:var(--purple-soft)!important;color:var(--purple)!important;box-shadow:inset 0 0 0 2px var(--purple)}
.hl-head{background:var(--blue-soft)!important;color:var(--blue)!important;box-shadow:inset 0 0 0 2px var(--blue)}
tr.dim td,tr.dim th{opacity:.18;text-decoration:line-through}
.new{animation:grow .6s ease both;background:var(--green-soft)!important;color:var(--green)}
@keyframes grow{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.gone{background:var(--red-soft)!important;color:var(--red)!important;text-decoration:line-through;animation:shake .5s ease 2}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.nan{background:var(--red-soft)!important;color:var(--red)!important;font-style:italic;font-weight:600}
.fixed{background:var(--green-soft)!important;color:var(--green)!important;font-weight:700;animation:grow .6s ease both}
.t{color:var(--green);font-weight:700} .f{color:var(--red);font-weight:700}
.g1{background:#2f6fde22!important} .g2{background:#e8a31726!important} .g3{background:#1e8f5a24!important}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.legend span{padding:2px 10px;border-radius:999px}

.out{background:var(--code-bg);color:var(--code-ink);border-radius:12px;padding:12px 14px;font-size:14px;white-space:pre;overflow-x:auto;animation:pop .4s ease}
.out:before{content:"Output ▸";display:block;color:var(--code-com);font-size:11px;margin-bottom:4px;letter-spacing:.06em}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.dict{display:flex;gap:12px;flex-wrap:wrap}
.box{border:2px solid var(--blue);border-radius:12px;padding:8px 12px;background:var(--blue-soft);animation:grow .5s ease both}
.box .k{font-weight:700;color:var(--blue);margin-bottom:4px}
.box .v{display:flex;gap:6px;flex-wrap:wrap}
.box .v span{background:var(--panel);border-radius:6px;padding:1px 8px;font-size:14px}
.file{border:2px solid var(--green);background:var(--green-soft);border-radius:4px 22px 12px 12px;padding:10px 14px;min-width:200px;animation:grow .5s ease both}
.file .fname{font-weight:700;color:var(--green);margin-bottom:6px}
.file pre{margin:0;font-size:13.5px;white-space:pre}
.file pre span{display:block;animation:pop .4s ease both}
.ready{font-size:22px;padding:30px;text-align:center;animation:grow .5s ease both}
.ready .em{font-size:60px;display:block}
.tip{border-left:4px solid var(--purple);background:var(--purple-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14.5px;animation:pop .4s ease}

.quiz{margin-top:26px}
.quiz h3{margin:0 0 6px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px}
.opt.right{background:var(--green-soft);border-color:var(--green)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.feedback{margin-top:10px;font-weight:600}
.remember{margin-top:20px}
.remember ul{margin:6px 0 0;padding-left:20px}
.remember code{background:var(--bg);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.nav-bottom{display:flex;justify-content:space-between;margin-top:26px;gap:10px}

.menu-btn{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 30% 0 0;z-index:5;transform:translateX(-105%);transition:.3s;height:100vh}
  aside.open{transform:none}
  .menu-btn{display:inline-block;margin-bottom:12px}
  main{padding:16px 16px 50px}
  .stage{grid-template-columns:1fr}
  .lesson-head h2{font-size:23px}
  .steps-dots{margin-left:0;width:100%}
}

a.chip{text-decoration:none;display:inline-block}
.g4{background:#7a4cc224!important}
.discuss{margin-top:20px;border-left:5px solid var(--purple)}
.discuss h3{margin:0}
.discuss ol{margin:8px 0 0;padding-left:22px}
.discuss li{margin:4px 0}
.discuss code,.story code,.bubble code{background:var(--bg);padding:1px 6px;border-radius:5px;border:1px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:10px;font-size:14px}
.bar-lbl{text-align:right;color:var(--muted);font-weight:600}
.bar{display:block;height:20px;border-radius:6px;background:var(--accent);transform-origin:left;animation:barGrow .7s ease both}
.bar-val{font-variant-numeric:tabular-nums;font-weight:600}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow-chip{background:var(--blue-soft);border:2px solid var(--blue);border-radius:999px;padding:6px 14px;font-weight:600;animation:grow .5s ease both}
.flow-arrow{color:var(--accent);font-size:20px}
.flags{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.flags li{background:var(--red-soft);border-left:4px solid var(--red);border-radius:0 10px 10px 0;padding:8px 12px;animation:pop .4s ease both}
.numline{position:relative;height:90px;margin:10px 4px 0;border-bottom:3px solid var(--line)}
.nl-dot{position:absolute;bottom:8px;width:14px;height:14px;border-radius:50%;background:var(--blue);animation:grow .4s ease both}
.nl-dot.out{background:var(--red);width:20px;height:20px;animation:grow .4s ease .6s both,shake .5s ease 1.1s 2}
.nl-box{position:absolute;bottom:4px;height:24px;border:2px solid var(--green);background:var(--green-soft);border-radius:6px}
.nl-lbl{position:absolute;bottom:-24px;font-size:12px;color:var(--muted);white-space:nowrap}
.joins{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="logo">🐼</span><div><h1>Pandas Class · Part 2</h1><small>Deeper skills + a real business case</small></div></div>
    <ul class="toc" id="toc"></ul>
    <div class="side-foot">
      <a class="chip" href="pandas_tutorial.html">⬅ Part 1</a>
      <button class="chip" id="themeBtn">🌓 Theme</button>
      <button class="chip" id="resetBtn">↺ Reset progress</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<script>
/* ---------- Part 2 data ---------- */
const copy = r => r.map(x => x.slice());
const range = n => [...Array(n).keys()];
function T(cols, rows, o = {}) { return Object.assign({cols, rows, idx: range(rows.length)}, o); }

/* 8 sample ChaiCart orders (after cleaning) — the full data has 60 orders */
const OCOLS = ["OrderID","OrderDate","City","Product","Qty","UnitPrice","Discount","Payment","DeliveryMins","Rating"];
const OS = [
  [1001,"2024-01-02","Mumbai","Veg Sandwich",3,90,0,"UPI",48,5],
  [1002,"2024-01-03","Delhi","Mango Lassi",1,70,15,"UPI",49,4],
  [1003,"2024-01-09","Mumbai","Paneer Wrap",3,150,15,"UPI",23,4],
  [1004,"2024-01-10","Pune","Brownie",1,80,0,"UPI",20,5],
  [1005,"2024-01-12","Mumbai","Samosa",4,25,0,"Card",31,"NaN"],
  [1006,"2024-01-17","Bengaluru","Mango Lassi",1,70,0,"Card",25,4],
  [1008,"2024-01-24","Pune","Paneer Wrap",5,150,15,"Card",20,5],
  [1010,"2024-01-28","Pune","Green Tea",3,60,5,"Card",20,5],
];
const sub = (cols, rows = OS) => { const ix = cols.map(c => OCOLS.indexOf(c)); return rows.map(r => ix.map(i => r[i])); };
const TS = (cols, o = {}, rows = OS) => T(cols, sub(cols, rows), o);
const keep = f => OS.map((r, i) => f(r) ? -1 : i).filter(i => i >= 0);          // rows to dim
const R = r => r[4] * r[5] * (1 - r[6] / 100);                                  // revenue
const r1 = v => Math.round(v * 10) / 10;
const CC = {Delhi:"g1", Mumbai:"g2", Pune:"g3", Bengaluru:"g4"};
const cityCls = rows => Object.fromEntries(rows.map((r, i) => [i, CC[r.find(v => CC[v])] || ""]));
const WD = d => ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(d + "T00:00:00Z").getUTCDay()];

const MARKS = [["Aarav",85],["Diya",92],["Rohan",78],["Isha",88],["Kabir",65]];
const MN = MARKS.map(m => m[0]);
const ser = (vals, idx, name = "value", o = {}) => Object.assign(T([name], vals.map(v => [v]), o), {idx});

const SCORES = [[80,70,90],[60,85,75],[95,88,92]];
const SN = ["Aarav","Diya","Rohan"], SUBJ = ["Maths","Science","English"];

const MS_COLS = ["OrderID","City","Product","Qty","Payment","DeliveryMins","Rating"];
const MS = [
  [1005,"Mumbai","Samosa",4,"Card",31,"NaN"],
  [1007," mumbai","Masala Chai",2,"UPI",15,5],
  [1010,"Pune","Green Tea",3,"Card","NaN",5],
  [1013,"Mumbai","Filter Coffee",250,"Cash",15,5],
  [1016,"Pune","Cold Coffee",4,"Cash",16,4],
  [1023,"Delhi","Filter Coffee",1,"NaN",16,5],
  [1016,"Pune","Cold Coffee",4,"Cash",16,4],
];
const swap = (rows, r, c, v) => { const x = copy(rows); x[r][c] = v; return x; };

const LONG = [["Bengaluru","2024-01",325],["Bengaluru","2024-02",380],["Delhi","2024-01",60],["Delhi","2024-02",850],["Mumbai","2024-01",832],["Mumbai","2024-02",202]];
const EXAM = [["Aarav","9A",78,82,74],["Diya","9A",92,85,95],["Rohan","9B",65,70,80],["Isha","9B",88,91,84]];
const EXLONG = []; ["Maths","Science","English"].forEach((s, k) => EXAM.forEach(e => EXLONG.push([e[0], e[1], s, e[2 + k]])));

const bars = (data, unit = "") => { const mx = Math.max(...data.map(d => d[1]));
  return `<div class="bars">${data.map((d, i) => `<div class="bar-row"><span class="bar-lbl">${d[0]}</span><span class="bar" style="width:${Math.max(4, d[1] / mx * 100)}%;animation-delay:${i * .12}s"></span><span class="bar-val">${unit}${d[1].toLocaleString("en-IN")}</span></div>`).join("")}</div>`; };
const chips = (items, cls = "") => `<div class="flow">${items.map((t, i) => `<span class="flow-chip ${cls}" style="animation-delay:${i * .15}s">${t}</span>`).join(`<span class="flow-arrow">➜</span>`)}</div>`;
const flags = items => `<ul class="flags">${items.map((t, i) => `<li style="animation-delay:${i * .15}s">${t}</li>`).join("")}</ul>`;

/* ---------- the 15 lessons ---------- */
const LESSONS = [
/* ===== 1 ===== */
{
  part:"A", title:"The Series Data Structure", icon:"📏",
  sub:"One labelled column — the building block of every DataFrame.",
  story:"A <b>Series</b> is <b>one column of data with labels</b>. Think of a row of <b>lockers</b> 🔐: every locker has a <b>label on the door</b> (the index) and <b>something inside</b> (the value).",
  steps:[
    {code:`marks = pd.Series([85, 92, 78, 88, 65])
marks`,
     say:"We give pandas a plain list. It becomes a Series. On the left, in <b style='color:var(--purple)'>purple</b>, pandas adds labels 0, 1, 2… automatically — that's the <b>index</b>.",
     board:()=>({tables:[ser(MARKS.map(m=>m[1]),range(5),"marks",{hlIdx:true,newRows:range(5)})]})},
    {code:`marks.values   # the data
marks.index    # the labels
marks.dtype    # the type`,
     say:"A Series has 4 parts: <b>values</b>, <b>index</b>, <b>dtype</b> (type of the values) and an optional <b>name</b>. <b>int64</b> means whole numbers.",
     board:()=>({tables:[ser(MARKS.map(m=>m[1]),range(5),"marks",{hlIdx:true})],out:`[85 92 78 88 65]\nRangeIndex(start=0, stop=5, step=1)\nint64`})},
    {code:`marks = pd.Series([85, 92, 78, 88, 65],
                  index=["Aarav", "Diya", "Rohan", "Isha", "Kabir"],
                  name="Marks")`,
     say:"Numbers 0–4 don't tell us much. Let's use <b>student names</b> as the index. Now every locker has a meaningful label!",
     board:()=>({tables:[ser(MARKS.map(m=>m[1]),MN,"Marks",{hlIdx:true})]})},
    {code:`price = pd.Series({"Masala Chai": 40, "Samosa": 25, "Brownie": 80})`,
     say:"Another way: from a <b>dictionary</b>. The <b>keys</b> become the index, the <b>values</b> become the data.",
     board:()=>({html:`<div class="dict"><div class="box"><div class="k">"Masala Chai"</div><div class="v"><span>40</span></div></div><div class="box" style="animation-delay:.2s"><div class="k">"Samosa"</div><div class="v"><span>25</span></div></div><div class="box" style="animation-delay:.4s"><div class="k">"Brownie"</div><div class="v"><span>80</span></div></div></div>`,
       tables:[ser([40,25,80],["Masala Chai","Samosa","Brownie"],"price",{newRows:[0,1,2],hlIdx:true})]})},
    {code:`branch_a = pd.Series({"Chai": 120, "Coffee": 80, "Samosa": 60})
branch_b = pd.Series({"Coffee": 90, "Samosa": 70, "Lassi": 40})
branch_a + branch_b`,
     say:"⭐ Two café branches. pandas adds by <b>matching labels</b>, not positions. <b>Chai</b> is only in A and <b>Lassi</b> only in B, so pandas can't add them → <b style='color:var(--red)'>NaN</b>.",
     board:()=>({tables:[ser([120,80,60],["Chai","Coffee","Samosa"],"branch_a"),ser([90,70,40],["Coffee","Samosa","Lassi"],"branch_b"),
       ser(["NaN",170,"NaN",130],["Chai","Coffee","Lassi","Samosa"],"a + b",{newCols:["a + b"]})]})},
    {code:`branch_a.add(branch_b, fill_value=0)`,
     say:"<b>fill_value=0</b> says: \"if a label is missing on one side, treat it as 0\". Now the totals are complete.",
     board:()=>({tables:[ser([120,170,40,130],["Chai","Coffee","Lassi","Samosa"],"total",{cells:{"0,0":"fixed","2,0":"fixed"}})],

{

  sub:"Find each problem, decide, fix — and explain why.",

  steps:[
    {code:`np.nan == np.nan              # False!
pd.Series([10, np.nan, 20]).mean()    # 15.0
pd.Series([10, np.nan, 20]).count()   # 2`,
     say:"NaN facts: NaN is <b>not equal to anything</b>, not even itself! So never test <b>x == np.nan</b> — use <b>isna()</b>. Also, mean() and count() <b>skip</b> NaN.",
     board:()=>({out:`False\n15.0\n2`,tip:"Always use <b>.isna()</b> / <b>.notna()</b> to find missing values."})},
    {code:`orders.isna().mean() * 100          # % missing per column
orders[orders.isna().any(axis=1)]     # rows with at least one NaN`, say:"New ways to find gaps: the <b>% missing</b> per column, and <b>any(axis=1)</b> to list every row with a problem. Every <b style='color:var(--red)'>red</b> cell here is one: missing values, a messy city name, a giant Qty, and a duplicate.",
     board:()=>({tables:[T(MS_COLS,MS,{cells:{"1,1":"nan","3,3":"nan"}})]})},
    {code:`city_median = orders.groupby("City")["DeliveryMins"].transform("median")
orders["DeliveryMins"] = orders["DeliveryMins"].fillna(city_median)`,
     say:"Part 1 filled with <b>one</b> number for everyone. But delivery time depends on the <b>city</b>, so fill with the <b>median of the same city</b>. Pune's median is <b>20</b> minutes. (City names and 'Unknown' payment were already fixed with Part 1 tools.)",
     board:()=>({tables:[T(MS_COLS,swap(swap(swap(MS,5,4,"Unknown"),1,1,"Mumbai"),2,5,20.0),{cells:{"2,5":"fixed","3,3":"nan"}})]})},
    {code:`orders["Rated"] = orders["Rating"].notna()`,
     say:"<b>Rating</b>: we <b>keep NaN</b> — inventing ratings would be lying to the owner! Instead we add a flag column <b>Rated</b>.",
     board:()=>({tables:[T(["OrderID","Rating","Rated"],[[1005,"NaN",false],[1007,5,true],[1010,5,true],[1013,5,true]],{newCols:["Rated"]})]})},
    {code:`orders[orders.duplicated(keep=False)]
orders = orders.drop_duplicates()`,
     say:"<b>duplicated(keep=False)</b> shows <b>all copies</b>. Then <b>drop_duplicates()</b> removes the extra one. Order 1016 was counted twice!",
     board:()=>({tables:[T(["OrderID","City","Product","Qty"],MS.map(r=>[r[0],r[1].trim().replace(/^\w/,c=>c.toUpperCase()).replace("MUMBAI","Mumbai"),r[2],r[3]]),{hlRows:[4],goneRows:[6]})]})},
    {code:`q1, q3 = s.quantile(0.25), s.quantile(0.75)
iqr = q3 - q1
low, high = q1 - 1.5 * iqr, q3 + 1.5 * iqr`,
     say:"<b>Outliers</b> with the <b>IQR rule</b> (the same rule box plots use). Anything below <b>low</b> or above <b>high</b> is an outlier.",
     board:()=>({html:`<div class="numline"><span class="nl-box" style="left:2%;width:6%"></span>${[1,2,2,3,3,3,4,4,5,5].map((v,i)=>`<span class="nl-dot" style="left:${1+v*1.2}%;animation-delay:${i*.05}s"></span>`).join("")}<span class="nl-dot out" style="left:95%"></span><span class="nl-lbl" style="left:0">1</span><span class="nl-lbl" style="left:9%">high ≈ 7.6</span><span class="nl-lbl" style="left:92%">250 🚩</span></div>`,
       out:`Qty:          limits -1.4 – 7.6   → outliers: [250]\nDeliveryMins: limits -10.4 – 72.6 → outliers: [480.0]`})},
    {code:`orders.loc[orders["Qty"] > high, "Qty"] = orders["Qty"].median()

     say:"Decide per outlier. <b>Qty 250</b> was a typo (we asked the shop) → replace with the <b>median (3)</b>. <b>480 minutes</b> really happened → <b>clip</b> it to 73 so it doesn't distort the average, and <b>report it</b>.",
     board:()=>({tables:[T(["OrderID","Product","Qty"],[[1013,"Filter Coffee",3]],{cells:{"0,2":"fixed"},cap:"Qty: typo → median"}),T(["OrderID","DeliveryMins"],[[1039,73]],{cells:{"0,1":"fixed"},cap:"Delivery: capped (was 480)"})]})},

  remember:["Use <code>isna()</code>, never <code>== np.nan</code>","<code>pd.to_numeric(errors=\"coerce\")</code> — junk → NaN","Group fill: <code>groupby(...).transform(\"median\")</code>","<code>dropna(subset=[...])</code>, <code>ffill()</code>, <code>interpolate()</code>","Flag column: <code>df[\"Rated\"] = df[\"Rating\"].notna()</code>","<code>duplicated(keep=False)</code>, <code>drop_duplicates()</code>","Outliers: IQR / z-score → remove, replace, <code>clip</code> or keep"],

{
  part:"B", title:"Creating New Columns", icon:"➕",

  story:"Nobody stored <b>Late or On time</b>, <b>Weekend</b> or <b>Order size</b> — we <b>create</b> them (called <b>feature engineering</b>). Part 1 covered maths columns, <b>apply</b> on one column and <b>map</b>. Here are the <b>new</b> tools. (A <b>Revenue</b> column was already made with Part 1 maths.)",
  steps:[
    {code:`orders["Month"] = orders["OrderDate"].dt.to_period("M").astype(str)

     say:"New <b>.dt</b> tools: <b>to_period(\"M\")</b> gives a year-month label, <b>day_name()</b> the weekday, and <b>dayofweek</b> a number (Monday = 0 … Saturday = 5, Sunday = 6) → a <b>weekend</b> flag.",
     board:()=>({tables:[T(["OrderDate","Month","Weekday","IsWeekend"],OS.map(r=>[r[1],r[1].slice(0,7),WD(r[1]),["Saturday","Sunday"].includes(WD(r[1]))]),{newCols:["Month","Weekday","IsWeekend"]})]})},
    {code:`orders["Delivery"] = np.where(orders["DeliveryMins"] > 35, "Late", "On time")`,
     say:"<b>np.where</b> = if/else for a whole column: more than 35 minutes → 'Late', otherwise 'On time'.",
     board:()=>({tables:[T(["OrderID","DeliveryMins","Delivery"],OS.map(r=>[r[0],r[8],r[8]>35?"Late":"On time"]),{newCols:["Delivery"],cells:Object.fromEntries(OS.map((r,i)=>[`${i},2`,r[8]>35?"nan":"fixed"]))})]})},
    {code:`conditions = [orders["Revenue"] >= 400, orders["Revenue"] >= 150]
choices = ["Large", "Medium"]
orders["OrderSize"] = np.select(conditions, choices, default="Small")`,
     say:"<b>np.select</b> = many conditions, checked <b>in order</b>; the first match wins. Nothing matches → <b>default</b>.",
     board:()=>({tables:[T(["OrderID","Revenue","OrderSize"],OS.map(r=>[r[0],r1(R(r)),R(r)>=400?"Large":R(r)>=150?"Medium":"Small"]),{newCols:["OrderSize"]})]})},
    {code:`orders["SpeedBand"] = pd.cut(orders["DeliveryMins"],
                             bins=[0, 25, 35, 100],
                             labels=["Fast", "Normal", "Slow"])`,
     say:"<b>pd.cut</b> puts numbers into <b>bins</b> you choose: 0–25 Fast, 25–35 Normal, 35–100 Slow. (<b>pd.qcut</b> makes equal-sized groups instead.)",
     board:()=>({tables:[T(["OrderID","DeliveryMins","SpeedBand"],OS.map(r=>[r[0],r[8],r[8]<=25?"Fast":r[8]<=35?"Normal":"Slow"]),{newCols:["SpeedBand"]})]})},
    {code:`orders["Promo"] = orders.apply(
    lambda row: "Bulk deal" if row["Qty"] >= 4 and row["Discount"] >= 10 else "-",
    axis=1)`,
     say:"In Part 1, apply worked on <b>one column</b>. With <b>axis=1</b> the lambda gets a <b>whole row</b>, so the rule can use <b>several columns</b>. Only order 1008 has 4+ items AND 10 %+ discount.",
     board:()=>({tables:[T(["OrderID","Qty","Discount","Promo"],OS.map(r=>[r[0],r[4],r[6],r[4]>=4&&r[6]>=10?"Bulk deal":"-"]),{newCols:["Promo"]})],tip:"apply(axis=1) is a slow loop on big data. The same rule with <b>np.where((a) & (b), ...)</b> is much faster."})},
    {code:`orders.assign(

    {code:`orders["CityAvgDelivery"] = orders.groupby("City")["DeliveryMins"].transform("mean")`,

  ],
  quiz:{q:"You need 3+ categories (Small / Medium / Large) from conditions. Best tool?",opts:["np.where","np.select","df.drop","pd.merge"],a:1,why:"np.where is for 2 choices; np.select handles many conditions with a default."},

  {q:"Three categories from conditions (Small/Medium/Large):",opts:["np.where","np.select","pd.melt","df.T"],a:1},
  {q:"Find customers who never ordered:",opts:["merge(how='inner')","merge(how='left', indicator=True) → '_merge' == 'left_only'","pd.concat","groupby().sum()"],a:1},
  {q:"Wide exam table (one column per subject) → long rows:",opts:["pivot","melt","unstack","crosstab"],a:1},
  {q:"pivot gives 'Index contains duplicate entries'. Use instead:",opts:["pivot_table with aggfunc","melt","drop","explode"],a:0},
  {q:"How many DIFFERENT products were sold?",opts:["df['Product'].count()","df['Product'].nunique()","len(df)","df['Product'].size"],a:1},
  {q:"Top 2 orders by revenue in EACH city:",opts:["df.nlargest(2, 'Revenue')","df.sort_values('Revenue', ascending=False).groupby('City').head(2)","df.head(2)","df.groupby('City').sum()"],a:1},
];
TEST.forEach((t,i)=>{const s=i%4;if(s===t.a)return;const right=t.opts[t.a];t.opts.splice(t.a,1);t.opts.splice(s,0,right);t.a=s;});

const PARTS = {A:"Part A · Foundations", B:"Part B · ChaiCart case", C:"🏆 Capstone"};

/* ---------- storage (safe) ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let done = new Set(store.get("pandas2-done",[]));
let cur = store.get("pandas2-lesson",0); if(!(cur>=0&&cur<=LESSONS.length)) cur=0;
let step = 0, seen = new Set(), timer = null, typing = null;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function highlight(src){
  // tiny python colouring: comments, strings, numbers, keywords
  return esc(src).replace(/(#.*$)|(&quot;|"[^"\n]*"|'[^'\n]*')|\b(\d+\.?\d*)\b|\b(import|as|from|True|False|None|and|or|in|not|lambda|def|if|else|elif|return|for|try|except)\b/gm,
    (m,c,s,n,k)=>c?`<span class="tk-c">${c}</span>`:s?`<span class="tk-s">${s}</span>`:n?`<span class="tk-n">${n}</span>`:`<span class="tk-k">${k}</span>`);
}
function fmt(v){
  if(v===true) return `<span class="t">True</span>`;
  if(v===false) return `<span class="f">False</span>`;
  return esc(v);
}
function tableHTML(t){
  const o = t, hc=new Set(o.hlCols||[]), nc=new Set(o.newCols||[]), gc=new Set(o.goneCols||[]);
  const hr=new Set(o.hlRows||[]), dr=new Set(o.dimRows||[]), nr=new Set(o.newRows||[]), gr=new Set(o.goneRows||[]);
  const cells=o.cells||{}, rc=o.rowCls||{};
  const colCls = c => hc.has(c)?"hl":nc.has(c)?"new":gc.has(c)?"gone":o.hlHead?"hl-head":"";
  let h = `<div class="tbl-wrap">${o.cap?`<div class="tbl-cap">${o.cap}</div>`:""}<table class="df"><thead><tr><th class="${o.hlIdx?"hl-idx":""}"></th>`;
  o.cols.forEach(c=>h+=`<th class="${colCls(c)}">${esc(c)}</th>`);
  h += `</tr></thead><tbody>`;
  o.rows.forEach((row,r)=>{
    const trc = [dr.has(r)?"dim":"", rc[r]||""].join(" ");
    const delay = nr.has(r)?` style="animation-delay:${r*0.12}s"`:"";
    h += `<tr class="${trc}"><th class="${o.hlIdx?"hl-idx":""} ${nr.has(r)?"new":""}"${delay}>${esc(o.idx[r])}</th>`;
    row.forEach((v,c)=>{
      const name=o.cols[c];
      let cls = cells[`${r},${c}`] || (v==="NaN"?"nan":"") || (hr.has(r)?"hl":"") || (gr.has(r)?"gone":"") || (nr.has(r)?"new":"") || (colCls(name)==="hl-head"?"":colCls(name));
      if(typeof v==="number") cls+=" num";
      h += `<td class="${cls}"${delay}>${fmt(v)}</td>`;
    });
    h += `</tr>`;
  });
  return h + `</tbody></table></div>`;
}
function fileHTML(f){
  return `<div class="file"${f.bad?` style="border-color:var(--red);background:var(--red-soft)"`:""}><div class="fname"${f.bad?` style="color:var(--red)"`:""}>${f.name}</div><pre>${f.lines.map((l,i)=>`<span style="animation-delay:${0.3+i*0.15}s">${esc(l)}</span>`).join("")}</pre></div>`;
}
function boardHTML(b){
  let h = "";
  if(b.html) h += b.html;
  const parts = [];
  if(b.file && b.fileFirst) parts.push(fileHTML(b.file));
  (b.tables||[]).forEach((t,i)=>{ if(i>0 || (b.arrow && parts.length)) parts.push(`<span class="arrow">➜</span>`); parts.push(tableHTML(t)); });
  if(b.file && !b.fileFirst){ if(parts.length) parts.push(`<span class="arrow">➜</span>`); parts.push(fileHTML(b.file)); }
  if(parts.length) h += `<div class="tables">${parts.join("")}</div>`;
  if(b.legend) h += `<div class="legend"><span class="g1">Delhi</span><span class="g2">Mumbai</span><span class="g3">Pune</span><span class="g4">Bengaluru</span></div>`;
  if(b.out) h += `<div class="out">${esc(b.out)}</div>`;
  if(b.tip) h += `<div class="tip">💡 ${b.tip}</div>`;
  return h;
}

/* ---------- render ---------- */
const $ = s => document.querySelector(s);
function renderTOC(){
  const best = store.get("pandas2-best",null);
  $("#toc").innerHTML = LESSONS.map((l,i)=>(i===0||l.part!==LESSONS[i-1].part?`<li class="sec">${PARTS[l.part]}</li>`:"")+`<li class="${done.has(i)?"done":""}"><button class="${i===cur?"active":""}" data-i="${i}"><span class="num">${done.has(i)?"✓":i+1}</span>${l.icon} ${l.title}</button></li>`).join("")
    + `<li class="sec">🏁 Finish</li><li class="${best===TEST.length?"done":""}"><button class="${cur===LESSONS.length?"active":""}" data-i="${LESSONS.length}"><span class="num">${best===TEST.length?"✓":"🏆"}</span>Final Test${best!==null?` (${best}/${TEST.length})`:""}</button></li>`;
  $("#toc").querySelectorAll("button").forEach(b=>b.onclick=()=>{go(+b.dataset.i);$("#side").classList.remove("open")});
}
function go(i){
  stopAuto(); cur=i; step=0; seen=new Set(); store.set("pandas2-lesson",cur);
  renderLesson(); renderTOC(); window.scrollTo({top:0,behavior:"smooth"});
}
function renderTest(){
  const answered = {};
  $("#main").innerHTML = `
    <button class="btn menu-btn" id="menuBtn">☰ Topics</button>
    <div class="lesson-head"><span class="big">🏆</span><div><h2>Final Test</h2><p>${TEST.length} questions from all the topics. Pick one answer for each question — your first click counts!</p></div></div>
    ${TEST.map((t,n)=>`<div class="card quiz" style="margin-top:14px" data-n="${n}"><div><b>Q${n+1}.</b> ${esc(t.q)}</div><div class="opts">${t.opts.map((o,i)=>`<button class="opt mono" data-i="${i}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    <div class="card" style="margin-top:20px;text-align:center"><div id="score" style="font-size:22px;font-weight:700">Score: 0 / ${TEST.length}</div><div id="scoreMsg" style="color:var(--muted)">Answer all questions to see your result.</div>
    <button class="btn" id="retry" style="margin-top:10px">↺ Try again</button></div>`;
  $("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
  $("#retry").onclick=()=>go(LESSONS.length);
  document.querySelectorAll(".quiz[data-n]").forEach(card=>{
    const n=+card.dataset.n, t=TEST[n];
    card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(n in answered) return;
      const i=+b.dataset.i; answered[n]=i===t.a;
      b.classList.add(i===t.a?"right":"wrong");
      card.querySelectorAll(".opt")[t.a].classList.add("right");
      const got=Object.values(answered).filter(Boolean).length, all=Object.keys(answered).length;
      $("#score").textContent=`Score: ${got} / ${TEST.length}`;
      if(all===TEST.length){
        $("#scoreMsg").textContent = got===TEST.length?"🌟 Perfect! You are a pandas star!":got>=Math.ceil(TEST.length*0.7)?"🎉 Great job! Review the red ones and try again.":"💪 Good try! Watch the lessons again and retake the test.";
        const best=store.get("pandas2-best",0); if(got>=best) store.set("pandas2-best",got); renderTOC();
      }
    });
  });
}
function renderLesson(){
  if(cur===LESSONS.length) return renderTest();
  const L = LESSONS[cur];
  $("#main").innerHTML = `
    <button class="btn menu-btn" id="menuBtn">☰ Topics</button>
    <div class="lesson-head"><span class="big">${L.icon}</span><div><h2>${cur+1}. ${L.title}</h2><p>${L.sub}</p></div></div>
    <div class="story">📖 ${L.story}</div>
    <div class="stage">
      <div>
        <div class="card code-card">
          <div class="code-top"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="lbl" id="stepLbl"></span><button class="copy" id="copyBtn">Copy</button></div>
          <pre class="code" id="code"></pre>
        </div>
        <div class="card teacher" style="margin-top:14px"><span class="face">👩‍🏫</span><div class="bubble" id="say"></div></div>
        <div class="controls">
          <button class="btn" id="prev">◀ Back</button>
          <button class="btn primary" id="next">Next ▶</button>
          <button class="btn" id="auto">▶ Auto play</button>
          <div class="steps-dots" id="dots"></div>
        </div>
      </div>
      <div class="card board"><div class="board-title">👀 Watch the table</div><div id="board" class="board"></div></div>
    </div>
    <div class="card quiz" id="quiz"></div>
    <div class="card remember"><h3 style="margin:0">📝 Remember</h3><ul>${L.remember.map(r=>`<li>${r}</li>`).join("")}</ul></div>
    ${L.discuss?`<div class="card discuss"><h3>🗣️ Discuss in class</h3><ol>${L.discuss.map(d=>`<li>${d}</li>`).join("")}</ol></div>`:""}
    <div class="nav-bottom">
      <button class="btn" id="prevL" ${cur===0?"disabled":""}>◀ Previous topic</button>
      <button class="btn primary" id="nextL">${cur===LESSONS.length-1?"Take the Final Test 🏆":"Next topic ▶"}</button>
    </div>`;
  $("#menuBtn").onclick=()=>$("#side").classList.toggle("open");
  $("#prev").onclick=()=>{stopAuto();show(step-1)};
  $("#next").onclick=()=>{stopAuto();show(step+1)};
  $("#auto").onclick=()=>timer?stopAuto():startAuto();
  $("#prevL").onclick=()=>go(cur-1);
  $("#nextL").onclick=()=>go(cur+1);
  $("#copyBtn").onclick=()=>{try{navigator.clipboard.writeText(L.steps[step].code);$("#copyBtn").textContent="Copied!";setTimeout(()=>{const b=$("#copyBtn");if(b)b.textContent="Copy"},1200)}catch(e){}};
  renderQuiz();
  show(0);
}
function show(i){
  if(cur===LESSONS.length) return;
  const L = LESSONS[cur];
  if(i<0||i>=L.steps.length) return;
  step=i; seen.add(i);
  const S = L.steps[i];
  $("#stepLbl").textContent = `Step ${i+1} of ${L.steps.length}`;
  typeCode(S.code);
  $("#say").outerHTML = `<div class="bubble" id="say">${S.say}</div>`;
  $("#board").innerHTML = boardHTML(S.board());
  $("#dots").innerHTML = L.steps.map((_,k)=>`<span class="${k===i?"on":seen.has(k)?"seen":""}"></span>`).join("");
  $("#prev").disabled = i===0;
  $("#next").disabled = i===L.steps.length-1;
}
function typeCode(src){
  clearInterval(typing);
  const el=$("#code"); let n=0;
  const speed = Math.max(8, 900/src.length);
  typing=setInterval(()=>{
    n+=2;
    if(n>=src.length){clearInterval(typing);el.innerHTML=highlight(src);return}
    el.innerHTML=esc(src.slice(0,n))+`<span class="caret"></span>`;
  },speed);
}
function startAuto(){
  $("#auto").textContent="⏸ Pause";
  if(step===LESSONS[cur].steps.length-1) show(0);
  timer=setInterval(()=>{
    if(step>=LESSONS[cur].steps.length-1){stopAuto();return}
    show(step+1);
  },5000);
}
function stopAuto(){clearInterval(timer);timer=null;const a=$("#auto");if(a)a.textContent="▶ Auto play"}
function renderQuiz(){
  const Q = LESSONS[cur].quiz;
  $("#quiz").innerHTML = `<h3>🧠 Quick quiz</h3><div>${Q.q}</div><div class="opts">${Q.opts.map((o,i)=>`<button class="opt mono" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="feedback" id="fb"></div>`;
  $("#quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    $("#quiz").querySelectorAll(".opt").forEach(x=>x.classList.remove("right","wrong"));
    if(i===Q.a){
      b.classList.add("right"); $("#fb").innerHTML=`🎉 Correct! ${Q.why}`; $("#fb").style.color="var(--green)";
      done.add(cur); store.set("pandas2-done",[...done]); renderTOC();
    } else {
      b.classList.add("wrong"); $("#fb").innerHTML=`Not quite — try again! 💪`; $("#fb").style.color="var(--red)";
    }
  });
}

/* keyboard: ← → to move steps */
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){stopAuto();show(step+1)}
  if(e.key==="ArrowLeft"){stopAuto();show(step-1)}
});
$("#themeBtn").onclick=()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark?"light":"dark"; store.set("pandas2-theme",r.dataset.theme);
};
$("#resetBtn").onclick=()=>{done=new Set();store.set("pandas2-done",[]);renderTOC()};
const savedTheme=store.get("pandas2-theme",null); if(savedTheme) document.documentElement.dataset.theme=savedTheme;

renderTOC(); renderLesson();
</script>
</body>
</html>
